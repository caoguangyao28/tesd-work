<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>threejs study - 使用webGl 绘制一个点</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
  <script src="http://www.yanhuangxueyuan.com/versions/threejsR92/build/three.js"></script>
</head>
<body>
<script>
  /**
   * 创建场景对象
   */
  var scene = new THREE.Scene();
  // 创建网格模型
  var geometry = new THREE.BoxGeometry(100, 100, 100); // 立方体几何对象
  var material = new THREE.MeshLambertMaterial({
      color: 0xffff00
    }); //材质对象Material
  var mesh = new THREE.Mesh(geometry, material); //网格模型对象Mesh
  scene.add(mesh); //网格模型添加到场景中
  // 光源设置
  // 点光源
  var point = new THREE.PointLight(0xffffff);
  point.position.set(400,200,300);// 点光源位置
  scene.add(point); // 添加 到场景

  //环境光
  var ambient = new THREE.AmbientLight(0x444444);
  scene.add(ambient);
  // console.log(scene)
  // console.log(scene.children)
  /**
   * 相机设置
   */
  var width = window.innerWidth; //窗口宽度
  var height = window.innerHeight; //窗口高度
  var k = width / height; //窗口宽高比
  var s = 200; //三维场景显示范围控制系数，系数越大，显示的范围越大

  //创建相机对象
  var camera = new THREE.OrthographicCamera(-s * k, s * k, s, -s, 1, 1000);
  camera.position.set(200, 300, 200); //设置相机位置
  camera.lookAt(scene.position); //设置相机方向(指向的场景对象)
  /**
   * 创建渲染器对象
   */
  var renderer = new THREE.WebGLRenderer();
  renderer.setSize(width, height);//设置渲染区域尺寸
  renderer.setClearColor(0xb9d3ff, 1); //设置背景颜色
  document.body.appendChild(renderer.domElement); //body元素中插入canvas对象
  //执行渲染操作   指定场景、相机作为参数
  // renderer.render(scene, camera);
  let T0 = new Date();// 上次的时间 为了保证匀速转到
  var animate = function() {
    let T1 = new Date();
    let t = T1 - T0; // ms 毫秒差
    T0 = T1;
    requestAnimationFrame(animate); // 类似于 setInterval， 保持 60FPS的频率 大约每 16.7ms 调用一次入参函数
    // mesh.rotation.x += 0.01;
    // mesh.rotation.y += 0.01;
    renderer.render(scene, camera)
    mesh.rotateY(0.001*t);// 旋转角速度 0.001弧度每毫秒
  }
  animate();
</script>
</body>
</html>
